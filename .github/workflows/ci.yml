name: CI / Deploy

# push 到 master：測試、建置，通過後自動部署到 cactus1998/portfolio-dist（GitHub Pages）
# pull request：只做測試與建置檢查，不部署
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 將 dist 推到 portfolio-dist 的 master 分支
      # keep_files：保留其他作品的子資料夾（fishing-reel、yoyi…），只覆蓋作品集本身的檔案
      # 需在本 repo 設定 secret DEPLOY_KEY（portfolio-dist 的 deploy key 私鑰，需有寫入權限）
      - name: Deploy to portfolio-dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: cactus1998/portfolio-dist
          publish_branch: master
          publish_dir: ./dist
          keep_files: true
          cname: kentfolio.dev
          full_commit_message: "deploy: ${{ github.event.head_commit.message }}"
